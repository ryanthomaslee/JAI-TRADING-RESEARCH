# Trading universe for market-intel
#
# WHY YAML for this (not Python)?
#   This file is meant to be edited by non-developers or read by other tools
#   (dashboards, notebooks) without importing Python.  YAML is the standard
#   config format for exactly this use case.
#
# Symbol groups:
#   Core:       Original 10 symbols with trained ML models (Phase 3)
#   S&P 100:    Large-cap US equities — liquid, well-covered
#   Mid-cap:    High-momentum growth names — more volatile, less reliable
#   Miners/ETF: Crypto-adjacent stocks (BTC miners, spot ETFs)
#   Crypto:     Liquid Binance pairs — top 50 by volume and age
#
# Failure policy: any symbol that fails to fetch is SKIPPED with a warning.
#   Causes: delisted, name change, regional restriction, new listing with
#   insufficient history.  Do not crash the pipeline for one bad symbol.

